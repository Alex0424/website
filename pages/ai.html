<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alexander Lindholm - DevOps Engineer Portfolio"
    />
    <meta property="og:image" content="/assets/images/spider_chart.png" />

    <link rel="stylesheet" href="/assets/css/footer.css" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <title>Alexander Lindholm</title>
    <link rel="icon" href="/favicon_animation.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon_fallback.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/assets/css/header.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@100..800&family=Caveat:wght@400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Roboto:wght@100&family=Sankofa+Display&display=swap"
      rel="stylesheet"
    />

    <style>
      .chat-container {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
        box-sizing: border-box;
      }
      #chat {
        border: 1px solid #ccc;
        height: 400px;
        overflow-y: auto;
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 8px;
      }
      .message {
        margin: 0.5rem 0;
        padding: 0.75rem;
        border-radius: 8px;
      }
      .user {
        background: #1379ff;
        text-align: right;
      }
      .ai {
        background: #32cd32;
        text-align: left;
      }
      #input {
        width: calc(100% - 110px);
        padding: 0.75rem;
        margin-right: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      #send {
        padding: 0.75rem 1rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">Alexander</div>
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul class="menu" id="menu">
        <li><a href="/">Home</a></li>
        <li><a href="/pages/ai.html">AI</a></li>
        <li><a href="/pages/skills.html">Skills</a></li>
        <li><a href="/pages/certification.html">Certifications</a></li>
        <li><a href="/pages/projects.html">Projects</a></li>
        <li><a href="/pages/experience.html">Experience</a></li>
      </ul>
    </nav>

    <h1 style="padding: 20px">Ask Alexander (AI-Powered ✨)</h1>
    <div class="chat-container">
      <div id="chat"></div>
      <input id="input" type="text" placeholder="Type a question..." />
      <button id="send">Send</button>
    </div>

    <script>
      const chat = document.getElementById('chat');
      const input = document.getElementById('input');
      const send = document.getElementById('send');

      send.addEventListener('click', async () => {
        const text = input.value.trim();
        if (!text) return;

        // Show user message
        const userMsg = document.createElement('div');
        userMsg.className = 'message user';
        userMsg.textContent = text;
        chat.appendChild(userMsg);

        let sessionId = localStorage.getItem('session_id');

        if (!sessionId) {
          sessionId = crypto.randomUUID();
          localStorage.setItem('session_id', sessionId);
        }

        // Call FastAPI
        try {
          const res = await fetch('https://api.alexanderlindholm.net/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: text,
              session_id: sessionId,
            }),
          });
          const data = await res.json();

          const aiMsg = document.createElement('div');
          aiMsg.className = 'message ai';
          aiMsg.textContent = data.answer;
          chat.appendChild(aiMsg);

          chat.scrollTop = chat.scrollHeight;
        } catch (e) {
          alert('API error');
        }

        input.value = '';
        input.focus();
      });
    </script>
    <script src="/assets/js/footer_placeholder.js"></script>
    <footer id="footer-placeholder"></footer>
    <script src="/assets/js/navigation.js"></script>
  </body>
</html>
