<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alexander Lindholm - DevOps &amp; Cloud Engineer Portfolio"
    />
    <meta property="og:image" content="/assets/images/spider_chart.png" />

    <title>Alexander Lindholm</title>

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@100..800&family=Caveat:wght@400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Roboto:wght@100&family=Sankofa+Display&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/assets/css/header.css" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/footer.css" />

    <link rel="stylesheet" href="/assets/css/home.css" />

    <style>
      .ai-hero {
        text-align: center;
        padding: 40px 16px 10px;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid rgb(255 90 90 / 40%);
        background: rgb(255 90 90 / 10%);
        color: #ffb4b4;
        font-size: 0.9rem;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff5a5a;
        box-shadow: 0 0 8px #ff5a5a;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      .chat-container {
        width: calc(100% - 32px);
        max-width: 820px;
        margin: 24px auto 40px;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid rgb(19 121 255 / 35%);
        background: rgb(13 17 23 / 70%);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 40px rgb(19 121 255 / 15%);
      }
      #chat {
        height: 420px;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .message {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.4;
        animation: pop-in 0.25s ease-out;
        overflow-wrap: anywhere;
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      .user {
        align-self: flex-end;
        background: linear-gradient(135deg, #1379ff, #5a4bff);
        border-bottom-right-radius: 4px;
      }
      .ai {
        align-self: flex-start;
        background: #1c2330;
        border: 1px solid #2d3748;
        border-bottom-left-radius: 4px;
      }
      .ai.error {
        border-color: rgb(255 90 90 / 50%);
        color: #ffb4b4;
      }
      .typing span {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 2px;
        border-radius: 50%;
        background: #6fb1ff;
        animation: bounce 1s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        50% {
          transform: translateY(-5px);
          opacity: 0.5;
        }
      }
      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      .suggestion {
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid #2d3748;
        background: transparent;
        color: #a8b3cf;
        font: inherit;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .suggestion:hover {
        border-color: #1379ff;
        color: #fff;
      }
      .input-row {
        display: flex;
        gap: 8px;
      }
      #input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #2d3748;
        background: #0d1117;
        color: #f0f6fc;
        font: inherit;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      #input:focus {
        border-color: #1379ff;
        box-shadow: 0 0 0 3px rgb(19 121 255 / 25%);
      }
      #send {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #1379ff, #5a4bff);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      #send:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 18px rgb(19 121 255 / 60%);
      }
      #send:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      @media (width <= 600px) {
        body.home h1 {
          font-size: 2rem;
        }
        #chat {
          height: 360px;
        }
        .message {
          max-width: 90%;
        }
      }
    </style>
  </head>
  <body class="home">
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <script src="/assets/js/nav_placeholder.js"></script>
    <div id="nav-placeholder"></div>

    <div class="ai-hero">
      <h1>Ask Alexander ✨</h1>
      <p class="subtitle">
        An AI that knows my experience, skills and projects
      </p>
      <div class="status-badge">
        <span class="status-dot"></span>
        Temporarily offline
      </div>
    </div>

    <div class="chat-container">
      <div id="chat" aria-live="polite">
        <div class="message ai">
          Hi! I'm Alexander's AI assistant. Ask me about his DevOps experience,
          skills or projects.
        </div>
      </div>
      <div class="suggestions">
        <button class="suggestion" type="button">
          What does Alexander work with?
        </button>
        <button class="suggestion" type="button">
          Which cloud tools does he know?
        </button>
        <button class="suggestion" type="button">
          Tell me about his projects
        </button>
      </div>
      <form class="input-row" id="chat-form">
        <input
          id="input"
          type="text"
          placeholder="Type a question..."
          autocomplete="off"
        />
        <button id="send" type="submit">Send</button>
      </form>
    </div>

    <script>
      const chat = document.getElementById('chat');
      const form = document.getElementById('chat-form');
      const input = document.getElementById('input');
      const send = document.getElementById('send');

      function addMessage(text, className) {
        const msg = document.createElement('div');
        msg.className = `message ${className}`;
        msg.textContent = text;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
        return msg;
      }

      function getSessionId() {
        let sessionId = localStorage.getItem('session_id');
        if (!sessionId) {
          sessionId = crypto.randomUUID();
          localStorage.setItem('session_id', sessionId);
        }
        return sessionId;
      }

      async function ask(text) {
        addMessage(text, 'user');
        input.value = '';
        send.disabled = true;

        const typing = addMessage('', 'ai typing');
        typing.innerHTML = '<span></span><span></span><span></span>';

        // Call FastAPI
        try {
          const res = await fetch('https://api.alexanderlindholm.net/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: text,
              session_id: getSessionId(),
            }),
          });
          if (!res.ok) throw new Error(res.status);
          const data = await res.json();
          typing.remove();
          addMessage(data.answer, 'ai');
        } catch (e) {
          typing.remove();
          addMessage(
            "Sorry, I'm offline right now. Please try again later!",
            'ai error',
          );
        }

        send.disabled = false;
        input.focus();
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (text && !send.disabled) ask(text);
      });

      document.querySelectorAll('.suggestion').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (!send.disabled) ask(btn.textContent);
        });
      });
    </script>
    <script src="/assets/js/home_background.js"></script>
    <script src="/assets/js/footer_placeholder.js"></script>
    <footer id="footer-placeholder"></footer>
    <script src="/assets/js/navigation.js"></script>
  </body>
</html>
